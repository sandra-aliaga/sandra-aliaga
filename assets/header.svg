<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Sandra Aliaga — personal terminal</title>
  <desc id="description">
    A retro terminal introducing Sandra, a Systems Engineering student who
    builds software and explores quantum computing. The command types itself and
    a cursor blinks.
  </desc>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#000" stroke-opacity="0.12" />
    </pattern>
    <clipPath id="window">
      <rect x="1" y="1" width="1198" height="418" rx="14" />
    </clipPath>
    <clipPath id="command">
      <rect class="typing" x="75" y="74" width="352" height="32" />
    </clipPath>
  </defs>
  <style>
    .typing {
      animation: typing 12s steps(20, end) infinite;
    }
    .cursor {
      transform: translateX(352px);
      animation: cursor 12s steps(20, end) infinite;
    }
    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes typing {
      0%,
      8% {
        width: 0;
      }
      35%,
      95% {
        width: 352px;
      }
      100% {
        width: 0;
      }
    }
    @keyframes cursor {
      0%,
      8% {
        transform: translateX(0);
      }
      35%,
      95% {
        transform: translateX(352px);
      }
      100% {
        transform: translateX(0);
      }
    }
    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }
      50%,
      100% {
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing,
      .cursor,
      .blink {
        animation: none;
      }
      .cursor {
        transform: translateX(352px);
      }
    }
  </style>
  <g clip-path="url(#window)">
    <rect width="1200" height="420" fill="#14151D" />
    <rect width="1200" height="46" fill="#232330" />
    <circle cx="27" cy="23" r="5" fill="#D99CAE" />
    <circle cx="47" cy="23" r="5" fill="#E5C890" />
    <circle cx="67" cy="23" r="5" fill="#A6CFA1" />
    <g
      font-family="'DejaVu Sans Mono', monospace"
      font-size="13"
      fill="#ABA5BF"
    >
      <text x="600" y="28" text-anchor="middle">
        sandra@arch: ~/personal-space
      </text>
      <text x="1157" y="28" text-anchor="end">01</text>
    </g>
    <g font-family="'DejaVu Sans Mono', monospace">
      <text x="40" y="98" font-size="23" fill="#A6CFA1">$</text>
      <g clip-path="url(#command)">
        <text
          x="75"
          y="98"
          font-size="23"
          textLength="352"
          lengthAdjust="spacingAndGlyphs"
          fill="#D6C3F4"
        >
          cat introduction.txt
        </text>
      </g>
      <g class="cursor">
        <rect
          class="blink"
          x="77"
          y="78"
          width="12"
          height="25"
          fill="#D6C3F4"
        />
      </g>
      <text
        x="40"
        y="180"
        font-size="61"
        font-weight="700"
        letter-spacing="-2"
        fill="#EEE9F5"
      >
        hello, i'm sandra
      </text>
      <g font-size="18">
        <text x="43" y="225" fill="#B3ACC4">
          Systems Engineering student / UNSA / Peru
        </text>
        <text x="43" y="270" fill="#D6C3F4">
          building software. exploring quantum computing.
        </text>
        <text x="43" y="299" fill="#D6C3F4">
          following a few good questions along the way.
        </text>
      </g>
      <path d="M40 336H1160" stroke="#383545" />
      <g font-size="14">
        <text x="43" y="373" fill="#A6CFA1">[ in progress ]</text>
        <text x="197" y="373" fill="#ABA5BF">
          learning, making, occasionally breaking things.
        </text>
        <text x="1157" y="373" text-anchor="end" fill="#D6C3F4">:wq</text>
      </g>
    </g>
    <rect
      y="46"
      width="1200"
      height="374"
      fill="url(#scanlines)"
      pointer-events="none"
    />
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="14" stroke="#454052" />
</svg>
