<svg
  xmlns="http://www.w3.org/2000/svg"
  width="540"
  height="42"
  viewBox="0 0 540 42"
  fill="none"
  role="img"
  aria-labelledby="title"
>
  <title id="title">[ end of file ] curiosity keeps running.</title>
  <defs>
    <clipPath id="reveal">
      <rect class="typing" x="165" y="5" width="264" height="32" />
    </clipPath>
  </defs>
  <style>
    .typing {
      animation: typing 10s steps(24, end) infinite;
    }
    .cursor {
      transform: translateX(264px);
      animation: cursor 10s steps(24, end) infinite;
    }
    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes typing {
      0%,
      8% {
        width: 0;
      }
      48%,
      95% {
        width: 264px;
      }
      100% {
        width: 0;
      }
    }
    @keyframes cursor {
      0%,
      8% {
        transform: translateX(0);
      }
      48%,
      95% {
        transform: translateX(264px);
      }
      100% {
        transform: translateX(0);
      }
    }
    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }
      50%,
      100% {
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing,
      .cursor,
      .blink {
        animation: none;
      }
    }
  </style>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="14">
    <text x="20" y="26" fill="#9B8BB5">[ end of file ]</text>
    <g clip-path="url(#reveal)">
      <text
        x="165"
        y="26"
        textLength="264"
        lengthAdjust="spacingAndGlyphs"
        fill="#A6CFA1"
      >
        curiosity keeps running.
      </text>
    </g>
  </g>
  <g class="cursor">
    <rect class="blink" x="167" y="13" width="8" height="16" fill="#D6C3F4" />
  </g>
</svg>
